name: swithfiber_tech_ps
description: "Native mobile application for Switch Fiber Field Technicians (PowerSync Architecture)."
publish_to: 'none'

# Gene - Oct 08, 2026: Bumped build number to 25 for Closed Testing release.
# version: 1.0.0+1
# Gene - Oct 24, 2026: Bumped version to 1.0.2+1 for LCP NAP features.
# version: 1.0.2+1
# Gene - Nov 03, 2026: Incremented version to 1.0.3+1 for Apple TestFlight release.
# version: 1.0.3+1
# Gene - Nov, 07, 2026: Bumped build number to 26 (above Play Console Closed Testing versionCode 25) for v1.0.3 Android Closed Testing release.
# version: 1.0.3+26
# Gene - Nov, 08, 2026: Incremented build number after + to 27 for Apple TestFlight and Google Play Closed Testing release.
# version: 1.0.3+27
# Gene - Nov, 11, 2026: Incremented build number after + to 28 for Apple TestFlight and Google Play Closed Testing release (LCP NAP image upload & GPS auto-sync).
version: 1.0.3+28

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Icons & Styling
  cupertino_icons: ^2.0.0
  intl: ^0.20.2

  # State Management
  signals_flutter: ^7.1.0

  # PowerSync: the only local database (SQLite engine, reactive queries,
  # offline upload queue once tables leave local-only mode)
  powersync: ^2.4.0
  sqlite_async: ^0.14.5
  logging: ^1.3.0

  # Filesystem paths (database file, cached photos, map tiles)
  path_provider: ^2.1.5
  path: ^1.9.0

  # Networking & Secure Storage
  dio: ^5.8.0+1
  crypto: ^3.0.7
  flutter_secure_storage: ^11.0.0
  uuid: ^4.5.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_map_cache: ^2.1.0
  http_cache_file_store: ^2.0.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0
  geolocator: ^14.0.3
  exif: ^3.3.0
  geocoding: ^5.0.0
  audioplayers: ^6.8.1
  app_badge_plus: ^1.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Gene - Oct, 09, 2026: Enlarge app launcher icon to fill ~78% of the square canvas across iOS and Android.
# # App icons. Android already ships a hand-made adaptive icon under
# # android/app/src/main/res, so only the iOS set is generated here, from the
# # same logo, with the alpha channel flattened onto white as App Store Connect
# # requires. Regenerate with: dart run flutter_launcher_icons
# flutter_launcher_icons:
#   android: false
#   ios: true
#   image_path: "assets/images/logo.png"
#   remove_alpha_ios: true
#   background_color_ios: "#FFFFFF"
flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Gene - Oct 3, 2026: Include sounds asset directory for audible dispatch alert chimes.
    - assets/sounds/

  # Calm Utility type (DESIGN.md). Bundled, never fetched: the app runs
  # offline. All three families are SIL Open Font License (assets/fonts/OFL-Barlow.txt).
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: Barlow Semi Condensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
