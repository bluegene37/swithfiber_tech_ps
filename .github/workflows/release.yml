# Builds signed, obfuscated release artifacts and deploys them to
# Google Play Store (Internal Testing track by default). When triggered
# by a version tag (v*), it also attaches the artifacts and debug symbols
# to a GitHub Release.
#
# Triggers:
#   - Push of tag matching 'v*' (e.g. v1.0.1)
#   - Manual trigger from Actions tab (workflow_dispatch)
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias (e.g. upload)
#   ANDROID_KEY_PASSWORD      key password
#   PLAY_CONFIG_JSON          Google Cloud Service Account JSON key authorized in Play Console
#   APPLE_CERTIFICATE_BASE64  base64 of distribution .p12 certificate
#   APPLE_CERTIFICATE_PASSWORD password for distribution .p12 certificate
#   APPLE_PROVISIONING_PROFILE_BASE64 base64 of App Store distribution provisioning profile
#   APP_STORE_CONNECT_API_KEY_BASE64 base64 of App Store Connect API AuthKey (.p8)
#   APP_STORE_CONNECT_KEY_ID  App Store Connect API Key ID
#   APP_STORE_CONNECT_ISSUER_ID App Store Connect API Issuer ID
#
# iOS needs a macOS runner plus signing certificates; it is left as a
# manual `flutter build ipa` from Xcode-signed machine (see docs/RELEASE.md).
# Gene - Oct 08, 2026: Added iOS TestFlight CI build and release job with ephemeral keychain and App Store Connect upload.
name: Release

on:
  push:
    # Gene - Oct 08, 2026: Extended tags trigger to support platform-specific tags (ios-v*, android-v*) alongside v*.
    # tags: ['v*']
    tags:
      - 'v*'
      - 'ios-v*'
      - 'android-v*'
  workflow_dispatch:
    # Gene - Oct 08, 2026: Extended workflow_dispatch inputs to allow selecting target platform (all, android, ios) for TestFlight support.
    # inputs:
    #   track:
    #     description: 'Google Play track'
    #     required: true
    #     default: 'internal'
    #     type: choice
    #     options:
    #       - internal
    #       - alpha
    #       - beta
    #       - production
    #   build_number:
    #     description: 'Override build number (integer). Leave blank to use GitHub run number.'
    #     required: false
    #     default: ''
    #     type: string
    inputs:
      platform:
        description: 'Target platform to release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      # Gene - Oct 09, 2026: Set default Google Play track to 'alpha' (Closed Testing) so running without track defaults to Closed Testing.
      # track:
      #   description: 'Google Play track'
      #   required: true
      #   default: 'internal'
      #   type: choice
      #   options:
      #     - internal
      #     - alpha
      #     - beta
      #     - production
      track:
        description: 'Google Play track (alpha = Closed Testing, internal = Internal Testing)'
        required: true
        default: 'alpha'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      build_number:
        description: 'Override build number (integer). Leave blank to use GitHub run number.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  # Gene - Oct 08, 2026: Added platform condition gate so android job only runs on push or when platform is all or android.
  # android:
  #   name: Android App Bundle + APK
  #   runs-on: ubuntu-latest
  android:
    name: Android App Bundle + APK
    runs-on: ubuntu-latest
    # Gene - Oct 08, 2026: Gated android job to skip when pushing ios-v* tags.
    # if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/ios-v')) || inputs.platform == 'all' || inputs.platform == 'android'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - run: flutter pub get

      - name: Gate on tests
        run: flutter test

      # Gene - Oct 09, 2026: Updated build parameter resolution to use pubspec.yaml build offset to prevent duplicate/lower version codes, and default track to alpha (Closed Testing).
      # - name: Resolve build parameters
      #   id: params
      #   run: |
      #     BUILD_NUM="${{ inputs.build_number }}"
      #     if [ -z "$BUILD_NUM" ]; then
      #       BUILD_NUM="${{ github.run_number }}"
      #     fi
      #     TRACK="${{ inputs.track }}"
      #     if [ -z "$TRACK" ]; then
      #       TRACK="internal"
      #     fi
      #     echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"
      #     echo "track=$TRACK" >> "$GITHUB_OUTPUT"
      # Gene - Nov, 07, 2026: Enforce a minimum base build offset of 25 so Android versionCode never drops below previously published Closed Testing builds even if pubspec.yaml build number is reset on version bumps.
      # - name: Resolve build parameters
      #   id: params
      #   run: |
      #     BUILD_NUM="${{ inputs.build_number }}"
      #     if [ -z "$BUILD_NUM" ]; then
      #       PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -s -f2)
      #       if [ -n "$PUBSPEC_BUILD" ]; then
      #         BUILD_NUM=$(( PUBSPEC_BUILD + ${{ github.run_number }} ))
      #       else
      #         BUILD_NUM="${{ github.run_number }}"
      #       fi
      #     fi
      #     TRACK="${{ inputs.track }}"
      #     if [ -z "$TRACK" ]; then
      #       TRACK="alpha"
      #     fi
      #     echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"
      #     echo "track=$TRACK" >> "$GITHUB_OUTPUT"
      - name: Resolve build parameters
        id: params
        run: |
          BUILD_NUM="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -s -f2)
            BASE_BUILD="${PUBSPEC_BUILD:-0}"
            if [ "$BASE_BUILD" -lt 25 ]; then
              BASE_BUILD=25
            fi
            BUILD_NUM=$(( BASE_BUILD + ${{ github.run_number }} ))
          fi
          TRACK="${{ inputs.track }}"
          if [ -z "$TRACK" ]; then
            TRACK="alpha"
          fi
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"

      - name: Verify signing & deployment secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON || secrets.PLAY_CONFIG_JSON }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned build."
            exit 1
          fi
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON (or PLAY_CONFIG_JSON) secret is not set; Google Play deployment will fail. Add your Google Play service account JSON key to repository secrets."
            exit 1
          fi

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" \
            "$KEYSTORE_PASSWORD" \
            "${KEY_ALIAS:-upload}" \
            "$KEY_PASSWORD" > android/key.properties

          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-upload}" > /dev/null 2>&1; then
            echo "::error::Keystore validation failed! ANDROID_KEYSTORE_PASSWORD does not match ANDROID_KEYSTORE_BASE64. Verify that the correct keystore and password are set in GitHub Secrets."
            exit 1
          fi
          echo "Keystore verified and setup complete."

      - name: Build App Bundle (Play Store)
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"
        run: |
          flutter build appbundle --release \
            --build-number=${{ steps.params.outputs.build_number }} \
            --obfuscate --split-debug-info=build/symbols/android

      - name: Build APK (direct install)
        run: |
          flutter build apk --release \
            --build-number=${{ steps.params.outputs.build_number }} \
            --obfuscate --split-debug-info=build/symbols/android

      - name: Archive symbols
        run: |
          REF_NAME="${{ github.ref_name }}"
          tar -czf "build/symbols-android-${REF_NAME}.tar.gz" -C build/symbols android

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON || secrets.PLAY_CONFIG_JSON }}
          packageName: dev.genexis.swithfibertech
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ steps.params.outputs.track }}
          status: completed

      - name: Attach to GitHub Release
        # Gene - Oct 08, 2026: Allow attaching Android artifacts for v* and android-v* tags.
        # if: startsWith(github.ref, 'refs/tags/v')
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            build/symbols-android-*.tar.gz

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"

  # Gene - Oct 08, 2026: Added iOS TestFlight CI build and release job with ephemeral keychain and App Store Connect upload.
  ios:
    name: iOS IPA + TestFlight
    runs-on: macos-latest
    # Gene - Oct 08, 2026: Gated ios job to skip when pushing android-v* tags.
    # if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios'
    if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/android-v')) || inputs.platform == 'all' || inputs.platform == 'ios'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - run: flutter pub get

      - name: Gate on tests
        run: flutter test

      # Gene - Oct 09, 2026: Updated build parameter resolution to use pubspec.yaml build offset to ensure CFBundleVersion always increments and avoids duplicate version codes.
      # - name: Resolve build parameters
      #   id: params
      #   run: |
      #     BUILD_NUM="${{ inputs.build_number }}"
      #     if [ -z "$BUILD_NUM" ]; then
      #       BUILD_NUM="${{ github.run_number }}"
      #     fi
      #     echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"
      # Gene - Nov, 11, 2026: Enforce a minimum base build offset of 25 on iOS as well so CFBundleVersion never collides with previously uploaded TestFlight builds.
      # - name: Resolve build parameters
      #   id: params
      #   run: |
      #     BUILD_NUM="${{ inputs.build_number }}"
      #     if [ -z "$BUILD_NUM" ]; then
      #       PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -s -f2)
      #       if [ -n "$PUBSPEC_BUILD" ]; then
      #         BUILD_NUM=$(( PUBSPEC_BUILD + ${{ github.run_number }} ))
      #       else
      #         BUILD_NUM="${{ github.run_number }}"
      #       fi
      #     fi
      #     echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"
      - name: Resolve build parameters
        id: params
        run: |
          BUILD_NUM="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -s -f2)
            BASE_BUILD="${PUBSPEC_BUILD:-0}"
            if [ "$BASE_BUILD" -lt 25 ]; then
              BASE_BUILD=25
            fi
            BUILD_NUM=$(( BASE_BUILD + ${{ github.run_number }} ))
          fi
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"

      - name: Verify iOS signing & deployment secrets
        env:
          # Gene - Oct 08, 2026: Support standard APPSTORE_* secret names matching deploy-testflight.yml.
          # CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          # CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          # ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          # ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          # ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.P12_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 || secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          MISSING=""
          [ -z "$CERT_BASE64" ] && MISSING="$MISSING (BUILD_CERTIFICATE_BASE64 or APPLE_CERTIFICATE_BASE64)"
          [ -z "$CERT_PASS" ] && MISSING="$MISSING (P12_PASSWORD or APPLE_CERTIFICATE_PASSWORD)"
          [ -z "$PROFILE_BASE64" ] && MISSING="$MISSING (BUILD_PROVISION_PROFILE_BASE64 or APPLE_PROVISIONING_PROFILE_BASE64)"
          [ -z "$ASC_KEY" ] && MISSING="$MISSING (APPSTORE_PRIVATE_KEY or APP_STORE_CONNECT_API_KEY_BASE64)"
          [ -z "$ASC_KEY_ID" ] && MISSING="$MISSING (APPSTORE_KEY_ID or APP_STORE_CONNECT_KEY_ID)"
          [ -z "$ASC_ISSUER_ID" ] && MISSING="$MISSING (APPSTORE_ISSUER_ID or APP_STORE_CONNECT_ISSUER_ID)"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required iOS secrets:$MISSING. Please configure them in repository settings."
            exit 1
          fi
          echo "All required iOS signing and App Store Connect secrets verified."

      # Gene - Nov, 11, 2026: Synchronized iOS certificate import, provisioning profile extraction, dynamic ExportOptions.plist generation, unsigned archive build (--no-codesign), and manual xcodebuild -exportArchive with deploy-testflight.yml to prevent Xcode automatic development signing errors on headless CI runners.
      # - name: Install Apple Certificate & Provisioning Profile
      #   # Gene - Nov 05, 2026: Added dual secret fallbacks matching verification step so both BUILD_* and APPLE_* secret names work seamlessly.
      #   # env:
      #   #   BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      #   #   P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #   #   BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      #   env:
      #     BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 }}
      #     P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 || secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      #   run: |
      #     KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
      #     KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
      #     echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      #
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      #     security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      #
      #     echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/build_cert.p12"
      #     security import "$RUNNER_TEMP/build_cert.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
      #     security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      #
      #     security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/"//g')
      #
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
      #     UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
      #     cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
      #     echo "Provisioning profile installed ($UUID.mobileprovision)."
      #
      # - name: Build iOS IPA
      #   run: |
      #     flutter build ipa --release \
      #       --build-number=${{ steps.params.outputs.build_number }} \
      #       --obfuscate --split-debug-info=build/symbols/ios \
      #       --export-options-plist=ios/ExportOptions.plist
      - name: Import Apple Distribution Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install Apple Provisioning Profile
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 || secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_TEMP="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_TEMP"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Extract UUID and Name from provisioning profile so Xcode manual export can locate it
          UUID=$(security cms -D -i "$PP_TEMP" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$PP_TEMP" | plutil -extract Name raw -)

          cp "$PP_TEMP" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
          echo "Installed Profile: $PROFILE_NAME (UUID: $UUID)"
          echo "profile_uuid=$UUID" >> "$GITHUB_ENV"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Generate ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>T7LB768N2Z</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>destination</key>
              <string>export</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>dev.genexis.swithfibertech</key>
                  <string>$profile_name</string>
              </dict>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF
          echo "Generated ios/ExportOptions.plist:"
          cat ios/ExportOptions.plist

      - name: Build iOS Archive (unsigned)
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "Building $VERSION_NAME+${{ steps.params.outputs.build_number }}"
          flutter build ipa --release --no-codesign \
            --build-name="$VERSION_NAME" \
            --build-number="${{ steps.params.outputs.build_number }}" \
            --obfuscate --split-debug-info=build/symbols/ios

      - name: Export and Sign IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Locate IPA file
        id: find_ipa
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA file found in build/ios/ipa!"
            exit 1
          fi
          echo "Found IPA file at: $IPA_PATH"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive symbols
        run: |
          REF_NAME="${{ github.ref_name }}"
          tar -czf "build/symbols-ios-${REF_NAME}.tar.gz" -C build/symbols ios

      - name: Upload to TestFlight
        # Gene - Oct 08, 2026: Support standard APPSTORE_* secret names matching deploy-testflight.yml.
        # env:
        #   APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        #   APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        #   APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        # run: |
        #   mkdir -p ~/.appstoreconnect/private_keys
        #   echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
        #
        #   xcrun altool --upload-app \
        #     -f build/ios/ipa/*.ipa \
        #     -t ios \
        #     --apiKey "$APP_STORE_CONNECT_KEY_ID" \
        #     --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          if echo "$APP_STORE_CONNECT_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$APP_STORE_CONNECT_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          else
            echo "$APP_STORE_CONNECT_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          fi

          # Gene - Nov, 11, 2026: Pass resolved ipa_path from find_ipa step instead of unquoted glob to handle spaces safely.
          # xcrun altool --upload-app \
          #   -f build/ios/ipa/*.ipa \
          #   -t ios \
          #   --apiKey "$APP_STORE_CONNECT_KEY_ID" \
          #   --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app \
            -f "${{ steps.find_ipa.outputs.ipa_path }}" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Attach to GitHub Release
        # Gene - Oct 08, 2026: Allow attaching iOS artifacts for v* and ios-v* tags.
        # if: startsWith(github.ref, 'refs/tags/v')
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/ios/ipa/*.ipa
            build/symbols-ios-*.tar.gz

      - name: Clean up keychain and temporary files
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf "$RUNNER_TEMP/build_cert.p12" "$RUNNER_TEMP/profile.mobileprovision" ~/.appstoreconnect/private_keys
