name: Deploy to Google Play Internal Testing

on:
  workflow_dispatch:
    inputs:
      auto_increment_build:
        description: 'Use GitHub run number as build number (avoids duplicate versionCode)'
        type: boolean
        default: true

concurrency:
  group: deploy-internal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-internal:
    name: Build & Deploy to Play Store (Internal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Gene - Nov, 28, 2026: Upgraded checkout to v7 for native Node.js 24 runner support (clears Node.js 20 deprecation warning).
        # uses: actions/checkout@v4
        uses: actions/checkout@v7

      # Gene - Nov, 12, 2026: Upgraded CI Java runtime from 17 to 21 LTS because AGP 9.3.1 Android Lint (JavaDocParser) invokes java.util.List.removeLast() (added in JDK 21), which throws NoSuchMethodError on JDK 17.
      # - name: Set up Java 17
      - name: Set up Java 21
        # Gene - Nov, 12, 2026: Upgraded setup-java to v5 and Flutter to 3.50.x to match Gradle 9.5.0 / AGP 9.3.1 / Kotlin 2.4.20 / Dart 3.14.0 release toolchain.
        # uses: actions/setup-java@v4
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # java-version: '17'
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # flutter-version: 3.47.x
          flutter-version: 3.50.x
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Set up release keystore & validate secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON || secrets.PLAY_CONFIG_JSON }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON (or PLAY_CONFIG_JSON) secret is not set! Please add it in GitHub repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" \
            "$KEYSTORE_PASSWORD" \
            "${KEY_ALIAS:-upload}" \
            "$KEY_PASSWORD" > android/key.properties

          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-upload}" > /dev/null 2>&1; then
            echo "::error::Keystore validation failed! ANDROID_KEYSTORE_PASSWORD does not match ANDROID_KEYSTORE_BASE64. Verify that the correct keystore and password are set in GitHub Secrets."
            exit 1
          fi
          echo "Keystore verified and setup complete."

      - name: Build Android App Bundle (.aab)
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"
        run: |
          if [ "${{ github.event.inputs.auto_increment_build }}" = "true" ]; then
            VERSION_NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            # Gene - Nov, 12, 2026: Derive BASE_BUILD from pubspec.yaml (minimum 39, above published store build 38) + github.run_number to match release.yml.
            # # Use offset + run_number so build number is always safely higher than existing releases
            # BUILD_NUMBER=$(( 10 + ${{ github.run_number }} ))
            PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -s -f2)
            BASE_BUILD="${PUBSPEC_BUILD:-0}"
            if [ "$BASE_BUILD" -lt 39 ]; then
              BASE_BUILD=39
            fi
            BUILD_NUMBER=$(( BASE_BUILD + ${{ github.run_number }} ))
            echo "Building $VERSION_NAME+$BUILD_NUMBER"
            flutter build appbundle --release \
              --build-name="$VERSION_NAME" \
              --build-number="$BUILD_NUMBER" \
              --obfuscate \
              --split-debug-info=build/symbols/android
          else
            flutter build appbundle --release \
              --obfuscate \
              --split-debug-info=build/symbols/android
          fi

      - name: Upload to Google Play Internal Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON || secrets.PLAY_CONFIG_JSON }}
          packageName: dev.genexis.swithfibertech
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
