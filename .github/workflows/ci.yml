name: CI

# Gene - Oct 09, 2026: Disabled automatic CI runs on push to main branch to prevent automatic android/test execution on push. Added workflow_dispatch for manual CLI execution.
# on:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, format, test
    runs-on: ubuntu-latest
    steps:
      # Gene - Nov, 28, 2026: Upgraded checkout to v7 for native Node.js 24 runner support (clears Node.js 20 deprecation warning).
      # - uses: actions/checkout@v4
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Gene - Nov, 12, 2026: Upgraded CI Flutter SDK to 3.50.x to match Gradle 9.5.0 / AGP 9.3.1 / Kotlin 2.4.20 / Dart 3.14.0 release toolchain.
          # flutter-version: 3.47.x
          flutter-version: 3.50.x
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Check formatting
        run: dart format --set-exit-if-changed -o none lib test

      - name: Test
        run: flutter test --coverage

      # Gene - Nov, 28, 2026: Upgraded upload-artifact to v7 for native Node.js 24 runner support (clears Node.js 20 deprecation warning).
      # - uses: actions/upload-artifact@v4
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  build-android:
    name: Build debug APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      # Gene - Nov, 28, 2026: Upgraded checkout to v7 for native Node.js 24 runner support (clears Node.js 20 deprecation warning).
      # - uses: actions/checkout@v4
      - uses: actions/checkout@v7

      # Gene - Nov, 12, 2026: Upgraded setup-java to v5 to clear GitHub Actions deprecation notice.
      # - uses: actions/setup-java@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Gene - Nov, 12, 2026: Upgraded CI Java runtime from 17 to 21 LTS because AGP 9.3.1 Android Lint (JavaDocParser) invokes java.util.List.removeLast() (added in JDK 21), which throws NoSuchMethodError on JDK 17.
          # java-version: '17'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Gene - Nov, 12, 2026: Upgraded CI Flutter SDK to 3.50.x to match Gradle 9.5.0 / AGP 9.3.1 / Kotlin 2.4.20 / Dart 3.14.0 release toolchain.
          # flutter-version: 3.47.x
          flutter-version: 3.50.x
          cache: true

      - run: flutter pub get

      - name: Build
        run: flutter build apk --debug

      # Gene - Nov, 28, 2026: Upgraded upload-artifact to v7 for native Node.js 24 runner support (clears Node.js 20 deprecation warning).
      # - uses: actions/upload-artifact@v4
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
